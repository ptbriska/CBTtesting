<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Visual & Autoscoring Test</title>
  
  <!-- MathJax Config & CDN -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    .page { display: none; padding: 20px; width: 100%; max-width: 1000px; margin: 0 auto; }
    .page.active { display: block; }
    
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }
    
    /* Metadata Badges */
    .badge-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-section { background: #e0f2fe; color: #0369a1; }
    .badge-subtest { background: #f3e8ff; color: #6b21a8; }
    .badge-level { background: #fef3c7; color: #92400e; }
    .badge-tipe { background: #dcfce7; color: #166534; }

    /* CBT Layout */
    .cbt-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .timer { background: #fef3c7; color: #b45309; padding: 6px 12px; border-radius: 20px; font-weight: bold; }
    .cbt-grid { display: grid; grid-template-columns: 1fr 260px; gap: 20px; }
    
    .option-item { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--border); padding: 12px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
    .option-item:hover { background: #f1f5f9; }
    
    .nav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .nav-num { border: 1px solid var(--border); padding: 8px; text-align: center; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .nav-num.active { background: var(--primary); color: #fff; }
    .nav-num.answered { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
    
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; }
    
    /* Multiline & Format Text Fix */
    .formatted-text {
      white-space: pre-line;
      word-break: break-word;
      line-height: 1.6;
    }
    
    .question-image {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 15px 0;
      border: 1px solid var(--border);
    }

    /* Report Table */
    .report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; text-align: center; }
    .report-card { background: #f1f5f9; padding: 15px; border-radius: 8px; }
    .report-card strong { font-size: 22px; display: block; margin-top: 5px; color: var(--primary); }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { border: 1px solid var(--border); padding: 10px; text-align: left; }
    th { background: #f8fafc; }
  </style>
</head>
<body>

  <!-- PAGE 1: START PAGE -->
  <div id="page1" class="page active">
    <div class="card" style="text-align: center; margin-top: 80px;">
      <h2 id="exam-title">Memuat data ujian...</h2>
      <p id="exam-sub" style="margin: 15px 0; color: #64748b;">Pengujian visual layout CBT & Autoscoring.</p>
      <button class="btn" id="start-btn" onclick="startExam()" disabled>Mulai Ujian</button>
    </div>
  </div>

  <!-- PAGE 2: CBT CORE -->
  <div id="page2" class="page">
    <div class="cbt-header card" style="margin-bottom: 10px;">
      <div><strong id="exam-name-header">CBT Test</strong></div>
      <div class="timer" id="timer-display">Sisa Waktu: --:--</div>
    </div>

    <div class="cbt-grid">
      <!-- Area Soal -->
      <div class="card">
        <!-- Section Keterangan Metadata Soal -->
        <div class="badge-container" id="question-badges"></div>

        <h3 id="question-number">Soal No. -</h3>
        <hr style="margin: 10px 0; border: none; border-top: 1px solid var(--border);">
        
        <!-- Soal & Gambar -->
        <div id="question-text" class="formatted-text" style="font-size: 16px; margin-bottom: 15px;"></div>
        <div id="question-image-container"></div>
        
        <!-- Pilihan/Input Jawaban -->
        <div id="options-container" style="margin-top: 15px;"></div>

        <div style="display: flex; justify-content: space-between; margin-top: 20px;">
          <button class="btn btn-secondary" onclick="prevQuestion()">Sebelumnya</button>
          <button class="btn" onclick="nextQuestion()">Berikutnya</button>
        </div>
      </div>

      <!-- Navigasi Soal -->
      <div class="card">
        <h4 style="margin-bottom: 10px;">Navigasi Soal</h4>
        <div class="nav-grid" id="nav-grid"></div>
        <button class="btn btn-success" style="width: 100%; margin-top: 25px;" onclick="finishExam()">Selesai & Submit</button>
      </div>
    </div>
  </div>

  <!-- PAGE 3: FINISH PAGE / LIVE REPORT -->
  <div id="page3" class="page">
    <div class="card">
      <h2 style="color: #16a34a; text-align: center;">Ujian Diselesaikan!</h2>
      <p style="text-align: center; color: #64748b; margin-top: 5px;">Hasil Live Report & Auto-Scoring</p>

      <div class="report-grid">
        <div class="report-card">Total Skor <strong id="rep-score">0</strong></div>
        <div class="report-card">Skor Maksimal <strong id="rep-max-score">0</strong></div>
        <div class="report-card">Persentase <strong id="rep-percent">0%</strong></div>
      </div>

      <h3 style="margin-top: 25px;">Rincian Jawaban Per Soal</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Tipe</th>
              <th>Jawaban Anda</th>
              <th>Kunci Jawaban</th>
              <th>Skor diperoleh</th>
            </tr>
          </thead>
          <tbody id="report-table-body"></tbody>
        </table>
      </div>

      <div style="text-align: center; margin-top: 25px;">
        <button class="btn btn-secondary" onclick="switchPage(1)">Kembali ke Halaman Awal</button>
      </div>
    </div>
  </div>

  <script>
    let examData = null;
    let currentIndex = 0;
    let userAnswers = {};

    // Helper untuk me-render MathJax secara teratur
    function renderMath() {
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise().catch(err => console.log('MathJax error:', err));
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetch('./GEODATIS-SEP26-Soal.json')
        .then(res => res.json())
        .then(data => {
          examData = data;
          document.getElementById('exam-title').innerText = data.nama_kegiatan || "Simulasi Ujian CBT";
          document.getElementById('exam-sub').innerText = `${data.lembaga} | Durasi: ${data.timer_menit} Menit`;
          document.getElementById('exam-name-header').innerText = data.nama_kegiatan;
          document.getElementById('timer-display').innerText = `Sisa Waktu: ${data.timer_menit}:00`;
          document.getElementById('start-btn').disabled = false;
        })
        .catch(err => {
          console.error(err);
          document.getElementById('exam-title').innerText = "Error Memuat JSON";
        });
    });

    function startExam() {
      if (!examData) return;
      userAnswers = {};
      buildNavGrid();
      renderQuestion(0);
      switchPage(2);
    }

    function switchPage(pageNum) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById('page' + pageNum).classList.add('active');
    }

    function buildNavGrid() {
      const grid = document.getElementById('nav-grid');
      grid.innerHTML = '';
      examData.questions.forEach((q, idx) => {
        const btn = document.createElement('div');
        btn.id = `nav-item-${idx}`;
        btn.className = 'nav-num' + (idx === 0 ? ' active' : '');
        btn.innerText = q.No;
        btn.onclick = () => renderQuestion(idx);
        grid.appendChild(btn);
      });
    }

    function updateNavStatus() {
      examData.questions.forEach((q, idx) => {
        const btn = document.getElementById(`nav-item-${idx}`);
        const hasAnswer = userAnswers[q.No] !== undefined && userAnswers[q.No] !== '' && JSON.stringify(userAnswers[q.No]) !== '{}';
        
        btn.className = 'nav-num';
        if (idx === currentIndex) btn.classList.add('active');
        else if (hasAnswer) btn.classList.add('answered');
      });
    updateNavStatus
    }

    function renderQuestion(index) {
      if (index < 0 || index >= examData.questions.length) return;
      currentIndex = index;
      const q = examData.questions[index];
      const rule = examData.scoring_rules[q.Tipe] || {};

      // 1. Metadata Badges
      const badgeContainer = document.getElementById('question-badges');
      badgeContainer.innerHTML = `
        <span class="badge badge-section">Section: ${q.Section || '-'}</span>
        <span class="badge badge-subtest">Subtest: ${q.Subtest || '-'}</span>
        <span class="badge badge-level">Level: ${q.Level || '-'}</span>
        <span class="badge badge-tipe">Tipe: ${q.Tipe} (${rule.deskripsi || '-'})</span>
      `;

      // 2. Header & Soal
      document.getElementById('question-number').innerText = `Soal No. ${q.No}`;
      
      // Menggunakan innerText agar \n dibaca sebagai pemisah baris oleh CSS white-space: pre-line
      document.getElementById('question-text').innerText = q.Soal;

      // Render Gambar Soal (Jika Ada)
      const imgContainer = document.getElementById('question-image-container');
      if (q.Gambar && q.Gambar.trim() !== "") {
        imgContainer.innerHTML = `<img src="${q.Gambar}" alt="Gambar Soal" class="question-image">`;
      } else {
        imgContainer.innerHTML = '';
      }

      // 3. Render Pilihan Input
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      const savedAns = userAnswers[q.No];

      if (['1A', '1B', '1C', '5A'].includes(q.Tipe)) {
        ['A', 'B', 'C', 'D', 'E'].forEach(opt => {
          if (q[opt] && q[opt] !== '-') {
            const checked = savedAns === opt ? 'checked' : '';
            const optionLabel = document.createElement('label');
            optionLabel.className = 'option-item';
            optionLabel.innerHTML = `
              <input type="radio" name="opt_${q.No}" value="${opt}" ${checked} onchange="saveAnswer(${q.No}, '${opt}')">
              <div><strong>${opt}.</strong> <span class="formatted-text">${q[opt]}</span></div>
            `;
            container.appendChild(optionLabel);
          }
        });
      } else if (q.Tipe === '2A') {
        const selectedArr = Array.isArray(savedAns) ? savedAns : [];
        ['A', 'B', 'C', 'D', 'E'].forEach(opt => {
          if (q[opt] && q[opt] !== '-') {
            const checked = selectedArr.includes(opt) ? 'checked' : '';
            const optionLabel = document.createElement('label');
            optionLabel.className = 'option-item';
            optionLabel.innerHTML = `
              <input type="checkbox" name="opt_${q.No}" value="${opt}" ${checked} onchange="saveMultiAnswer(${q.No})">
              <div><strong>${opt}.</strong> <span class="formatted-text">${q[opt]}</span></div>
            `;
            container.appendChild(optionLabel);
          }
        });
      } else if (['3A', '3B'].includes(q.Tipe)) {
        const val = savedAns || '';
        container.innerHTML = `<input type="text" value="${val}" placeholder="Ketik jawaban Anda..." oninput="saveAnswer(${q.No}, this.value)">`;
      } else if (q.Tipe === '4A') {
        const tfObj = savedAns || {};
        let html = '<table style="width:100%; border-collapse:collapse;">';
        ['A', 'B', 'C', 'D', 'E'].forEach(opt => {
          if (q[opt]) {
            const bChecked = tfObj[opt] === 'B' ? 'checked' : '';
            const sChecked = tfObj[opt] === 'S' ? 'checked' : '';
            html += `
              <tr style="border-bottom:1px solid #e2e8f0; height:45px;">
                <td class="formatted-text">${q[opt]}</td>
                <td style="width:90px; text-align:center;">
                  <label><input type="radio" name="tf_${q.No}_${opt}" value="B" ${bChecked} onchange="saveTFAnswer(${q.No}, '${opt}', 'B')"> Benar</label>
                </td>
                <td style="width:90px; text-align:center;">
                  <label><input type="radio" name="tf_${q.No}_${opt}" value="S" ${sChecked} onchange="saveTFAnswer(${q.No}, '${opt}', 'S')"> Salah</label>
                </td>
              </tr>`;
          }
        });
        html += '</table>';
        container.innerHTML = html;
      }

      updateNavStatus();
      
      // Memicu MathJax setelah elemen HTML sepenuhnya dirender
      setTimeout(renderMath, 50);
    }

    // Handlers Penyimpanan Jawaban
    function saveAnswer(qNo, val) {
      userAnswers[qNo] = val;
      updateNavStatus();
    }

    function saveMultiAnswer(qNo) {
      const checkedBoxes = document.querySelectorAll(`input[name="opt_${qNo}"]:checked`);
      userAnswers[qNo] = Array.from(checkedBoxes).map(cb => cb.value);
      updateNavStatus();
    }

    function saveTFAnswer(qNo, optKey, val) {
      if (!userAnswers[qNo]) userAnswers[qNo] = {};
      userAnswers[qNo][optKey] = val;
      updateNavStatus();
    }

    function prevQuestion() { renderQuestion(currentIndex - 1); }
    function nextQuestion() { renderQuestion(currentIndex + 1); }

    // Fitur Auto-Scoring & Live Report
    function finishExam() {
      let totalScore = 0;
      let maxScoreTotal = 0;
      let tableRows = '';

      examData.questions.forEach(q => {
        const rule = examData.scoring_rules[q.Tipe];
        const uAns = userAnswers[q.No];
        let qScore = 0;
        let qMaxScore = 0;
        let displayAns = uAns !== undefined ? JSON.stringify(uAns) : '-';
        let displayKey = JSON.stringify(q.Kunci);

        if (['1A', '1B', '1C'].includes(q.Tipe)) {
          if (q.Tipe === '1A') qMaxScore = rule.skor_benar;
          else if (q.Tipe === '1B') qMaxScore = rule.skor_benar;
          else if (q.Tipe === '1C') qMaxScore = rule.bobot_level[q.Level] || 1.0;

          if (uAns === q.Kunci) {
            qScore = qMaxScore;
          } else if (uAns && q.Tipe === '1B') {
            qScore = rule.skor_salah; // Minus penalty
          }
          displayAns = uAns || '-';
          displayKey = q.Kunci;
        } 
        else if (q.Tipe === '2A') {
          qMaxScore = rule.skor_benar_semua;
          const kArr = Array.isArray(q.Kunci) ? q.Kunci.slice().sort() : [];
          const uArr = Array.isArray(uAns) ? uAns.slice().sort() : [];
          if (JSON.stringify(kArr) === JSON.stringify(uArr)) {
            qScore = qMaxScore;
          }
          displayAns = uArr.length ? uArr.join(', ') : '-';
          displayKey = kArr.join(', ');
        } 
        else if (['3A', '3B'].includes(q.Tipe)) {
          qMaxScore = rule.skor_benar;
          if (uAns && String(uAns).trim().toLowerCase() === String(q.Kunci).trim().toLowerCase()) {
            qScore = qMaxScore;
          }
          displayAns = uAns || '-';
          displayKey = q.Kunci;
        } 
        else if (q.Tipe === '4A') {
          const keys = ['A', 'B', 'C', 'D', 'E'].filter(k => q[k]);
          qMaxScore = keys.length * rule.skor_per_baris_benar;
          let uList = [];
          if (uAns && typeof uAns === 'object') {
            keys.forEach((k, idx) => {
              uList.push(uAns[k] || '-');
              if (uAns[k] === q.Kunci[idx]) {
                qScore += rule.skor_per_baris_benar;
              }
            });
          }
          displayAns = uList.length ? uList.join(', ') : '-';
          displayKey = Array.isArray(q.Kunci) ? q.Kunci.join(', ') : q.Kunci;
        } 
        else if (q.Tipe === '5A') {
          qMaxScore = rule.skor_maksimal;
          if (uAns && q.Kunci[uAns] !== undefined) {
            qScore = q.Kunci[uAns];
          }
          displayAns = uAns || '-';
          displayKey = 'Skala Likert (Best: C=5)';
        }

        totalScore += qScore;
        maxScoreTotal += qMaxScore;

        tableRows += `
          <tr>
            <td><strong>${q.No}</strong></td>
            <td>${q.Tipe}</td>
            <td>${displayAns}</td>
            <td>${displayKey}</td>
            <td><strong>${qScore}</strong> / ${qMaxScore}</td>
          </tr>`;
      });

      // Update UI Live Report
      document.getElementById('rep-score').innerText = totalScore;
      document.getElementById('rep-max-score').innerText = maxScoreTotal;
      document.getElementById('rep-percent').innerText = maxScoreTotal > 0 ? Math.round((totalScore / maxScoreTotal) * 100) + '%' : '0%';
      document.getElementById('report-table-body').innerHTML = tableRows;

      switchPage(3);
      setTimeout(renderMath, 50);
    }
  </script>
</body>
</html>
